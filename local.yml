- hosts: localhost
  connection: local
  gather_facts: true
  pre_tasks:
    - name: Check if running on macOS
      ansible.builtin.fail:
        msg: "This playbook only runs on macOS. Detected OS: {{ ansible_os_family }}"
      when: ansible_os_family != "Darwin"

    - name: Check if Homebrew is installed
      block:
        - name: Check if Homebrew is installed
          homebrew:
            update_homebrew: true
          check_mode: true
        - name: Homebrew available
          debug:
            msg: Homebrew is installed
      rescue:
        - name: No homebrew
          debug:
            msg: Homebrew is not installed

  tasks:
    - name: Install ssh keys
      ansible.builtin.import_tasks:
        file: tasks/ssh.yml

    - name: Setup terminal and shell
      ansible.builtin.import_tasks:
        file: tasks/terminal.yml

    - name: Setup git
      ansible.builtin.import_tasks:
        file: tasks/git.yml

    - name: Setup yabai and skhd
      ansible.builtin.import_tasks:
        file: tasks/yabai.yml

    - name: Setup Karabiner
      ansible.builtin.import_tasks:
        file: tasks/karabiner.yml

    - name: Setup nvm and Node.js
      ansible.builtin.import_tasks:
        file: tasks/nvm.yml

    - name: Setup pyenv and Python
      ansible.builtin.import_tasks:
        file: tasks/python.yml

    - name: Setup Go
      ansible.builtin.import_tasks:
        file: tasks/go.yml

    - name: Setup Ruby
      ansible.builtin.import_tasks:
        file: tasks/ruby.yml

    - name: Setup neovim
      ansible.builtin.import_tasks:
        file: tasks/neovim.yml

    - name: Setup dev tools
      ansible.builtin.import_tasks:
        file: tasks/devtools.yml

    - name: Setup CLI tools
      ansible.builtin.import_tasks:
        file: tasks/cli-tools.yml

    - name: Setup cloud and k8s tools
      ansible.builtin.import_tasks:
        file: tasks/cloud-k8s.yml

    - name: Setup local AI tools
      ansible.builtin.import_tasks:
        file: tasks/ai-tools.yml

    - name: Setup Claude Code config
      ansible.builtin.import_tasks:
        file: tasks/claude.yml

    - name: Setup Docker
      ansible.builtin.import_tasks:
        file: tasks/docker.yml

    - name: Install apps
      ansible.builtin.import_tasks:
        file: tasks/apps.yml

    - name: Install App Store apps
      ansible.builtin.import_tasks:
        file: tasks/mas.yml

    - name: Setup custom LaunchAgents
      ansible.builtin.import_tasks:
        file: tasks/launchagents.yml

    - name: Setup macOS defaults
      ansible.builtin.import_tasks:
        file: tasks/macos.yml

    - name: Setup Codeman
      ansible.builtin.import_tasks:
        file: tasks/codeman.yml

