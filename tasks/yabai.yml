# yabai comes from the asmvik fork tap, not homebrew core.
- name: Tap asmvik/formulae
  community.general.homebrew_tap:
    name: asmvik/formulae

- name: Trust asmvik tap
  ansible.builtin.shell: brew trust asmvik/formulae
  args:
    executable: /bin/bash
  changed_when: false

- name: Install yabai
  community.general.homebrew:
    name: asmvik/formulae/yabai
    state: present

- name: Install skhd
  community.general.homebrew:
    name: skhd
    state: present

- name: Ensure .config/yabai directory exists
  ansible.builtin.file:
    dest: "{{ lookup('env', 'HOME') }}/.config/yabai"
    mode: '0755'
    state: directory

- name: Ensure .config/skhd directory exists
  ansible.builtin.file:
    dest: "{{ lookup('env', 'HOME') }}/.config/skhd"
    mode: '0755'
    state: directory

- name: Copy yabairc
  ansible.builtin.copy:
    src: "../files/yabairc"
    dest: "{{ lookup('env', 'HOME') }}/.config/yabai/yabairc"
    mode: '0755'

- name: Copy skhdrc
  ansible.builtin.copy:
    src: "../files/skhdrc"
    dest: "{{ lookup('env', 'HOME') }}/.config/skhd/skhdrc"
    mode: '0644'
