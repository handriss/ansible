- name: Install Claude Code
  community.general.homebrew_cask:
    name: claude-code
    state: present

- name: Install Terraform
  community.general.homebrew:
    name: terraform
    state: present

- name: Install AWS CLI
  community.general.homebrew:
    name: awscli
    state: present

- name: Ensure .aws directory exists
  ansible.builtin.file:
    dest: "{{ lookup('env', 'HOME') }}/.aws"
    mode: '0700'
    state: directory

# AWS profiles are personal and often contain client infrastructure, so this
# playbook deliberately ships none. Configure your own after the run:
#   aws configure sso            (recommended — no long-lived keys on disk)
#   aws configure --profile foo  (static keys, if you must)
- name: Note that AWS profiles are not managed here
  ansible.builtin.debug:
    msg: >-
      ~/.aws is created but left empty. Run `aws configure sso` to set up a
      profile; this playbook intentionally does not ship credentials.

- name: Install Google Cloud SDK
  community.general.homebrew_cask:
    name: gcloud-cli
    state: present
