# Custom user LaunchAgents.
#
# Personal agents (e.g. the speechlab mic/sync pair) are intentionally not
# shipped here — they reference private projects. Drop your own plists into
# files/launchagents/ and add them below.

- name: Copy caps-lock-to-escape LaunchAgent
  ansible.builtin.copy:
    src: "../files/launchagents/com.local.caps-lock-to-escape.plist"
    dest: "{{ lookup('env', 'HOME') }}/Library/LaunchAgents/com.local.caps-lock-to-escape.plist"
    mode: '0644'
    backup: true

- name: Load caps-lock-to-escape LaunchAgent
  ansible.builtin.shell: |
    launchctl print "gui/$(id -u)/com.local.caps-lock-to-escape" >/dev/null 2>&1 || \
      launchctl bootstrap "gui/$(id -u)" "$HOME/Library/LaunchAgents/com.local.caps-lock-to-escape.plist"
  args:
    executable: /bin/bash
