- name: Install WebStorm
  community.general.homebrew_cask:
    name: webstorm
    state: present

- name: Install GoLand
  community.general.homebrew_cask:
    name: goland
    state: present

- name: Install DataGrip
  community.general.homebrew_cask:
    name: datagrip
    state: present

- name: Install Google Chrome
  community.general.homebrew_cask:
    name: google-chrome
    state: present

- name: Install utility apps
  community.general.homebrew_cask:
    name:
      - tailscale-app
      - utm
      - mitmproxy
      - iina
      - handy
      - openmtp
      - android-platform-tools
      - claude
      - wispr-flow
      - anki
    state: present

# Hiddify has no Homebrew cask — installed manually from
# https://github.com/hiddify/hiddify-app (see README).
