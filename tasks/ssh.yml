- name: Ensure .ssh directory exists.
  ansible.builtin.file:
    dest: "{{ lookup('env', 'HOME') }}/.ssh"
    mode: 0700
    state: directory

# Generate a key rather than shipping one. Never overwrites an existing key —
# `force: false` means an existing id_ed25519 is left exactly as it is.
- name: Generate an Ed25519 SSH key if none exists
  community.crypto.openssh_keypair:
    path: "{{ lookup('env', 'HOME') }}/.ssh/id_ed25519"
    type: ed25519
    comment: "{{ git_user_email | default(lookup('env', 'USER')) }}"
    force: false
    mode: '0600'
  register: ssh_key

- name: Show the public key to add to GitHub
  ansible.builtin.debug:
    msg: >-
      Public key at ~/.ssh/id_ed25519.pub —
      add it at https://github.com/settings/keys
  when: ssh_key.changed
